services:
  web-app:
    container_name: web-app
    env_file:
      - ./web-app/.env.local
    build:
      context: ./web-app
      dockerfile: Dockerfile
      args:
        # Values inherited from env_file (./web-app/.env.local) — no duplication in root .env
        - NEXT_PUBLIC_APP_URL
        - NEXT_PUBLIC_API_URL
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        - NEXT_PUBLIC_CLERK_SIGN_IN_URL
        - NEXT_PUBLIC_CLERK_SIGN_UP_URL
        - NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        - NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - app-network

  # One-shot release phase: applies Alembic migrations, then exits.
  # Dokploy deploys with `docker compose up -d --build` and offers no
  # release-phase hook, so the ordering has to live here. `server` is gated on
  # this exiting 0 — a failed migration fails the deploy and leaves the
  # previously running container serving the old image.
  # Shares `server`'s image tag by construction — keep the env config in sync.
  migrate:
    image: ${COMPOSE_PROJECT_NAME}-server
    build:
      context: ./server
      args:
        APP_ENV: production
    command: ["bash", "scripts/migrate.sh"]
    volumes:
      - ./server/logs:/app/logs
    env_file:
      - ./server/.env.production
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=db
      # Migrations don't call an LLM; a missing key must not fail a deploy.
      - REQUIRED_ENV_VARS=
    depends_on:
      db:
        condition: service_healthy
    # Must not restart, or `service_completed_successfully` never latches.
    restart: "no"
    networks:
      - app-network

  server:
    image: ${COMPOSE_PROJECT_NAME}-server
    build:
      context: ./server
      args:
        APP_ENV: production
    ports:
      - "8000:8000"
    volumes:
      - ./server/logs:/app/logs
    env_file:
      - ./server/.env.production
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: pgvector/pgvector:pg16
    env_file:
      - ./server/.env.production
    # No host port binding — DB is only accessible within the Docker network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
