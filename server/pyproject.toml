[project]
name = "server"
# Single source for the API's version: app/core/metadata.py reads it from here
# and FastAPI serves it, so this is the number that appears in openapi.json and
# in the status widget. Bumping it is a contract change — regenerate.
version = "1.0.0"
description = "Personal Finance Server - the API behind the Personal Finance app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "langchain>=1.0.5",
    "langchain-core>=1.0.4",
    "langchain-openai>=1.0.2",
    "langfuse==3.9.1",
    "langgraph>=1.0.2",
    "langgraph-checkpoint-postgres>=3.0.1",
    "pyjwt[crypto]>=2.9.0",
    # >=7.0.0: app/integrations/clerk/client.py imports ClerkBaseError, the
    # common base of ClerkErrors and SDKError. Verified present at 7.0.0; an
    # older resolve would fail the import at startup.
    "clerk-backend-api>=7.0.0",
    "psycopg[binary]>=3.3.2",
    "asyncpg>=0.30.0",
    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "structlog>=25.2.0",
    "uvicorn>=0.34.0",
    "slowapi>=0.1.9",
    "email-validator>=2.2.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "asgiref>=3.8.1",
    "tenacity>=9.1.2",
    "mem0ai>=1.0.0",
    "uvloop>=0.22.1",
    "greenlet>=3.1.1",
    "asgi-correlation-id>=4.3.4",
    "alembic>=1.18.3",
    "svix>=2.1.0",
    # Import only uuid_utils.compat.uuid7: it returns a stdlib uuid.UUID. The bare
    # uuid_utils.uuid7 returns a Rust type SQLAlchemy and asyncpg do not bind.
    "uuid-utils>=0.17.0",
    "sse-starlette>=3.5.0",
]

[project.optional-dependencies]
dev = ["djlint==1.36.4"]
eval = ["colorama>=0.4.6", "tqdm>=4.67.1"]

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "import-linter>=2.0",
    "ruff>=0.16.5",
]
test = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "testcontainers>=4.15.0",
]


[tool.uv]
# TEMPORARY HOLD — one left. Remove it in its own commit.
#
# openai sits under langchain-openai on every LLM call, a path the test suite
# mocks, so a green run would not prove a bump working. It needs a manual
# smoke against the real API before the ceiling moves:
#
#   openai <4   (3.7.0 in the lock; the 4.x major is what is held)
#     The earlier <2.34 and <3 ceilings are both gone. LLMRegistry stores
#     configuration and builds clients on first use, so importing app.main
#     needs no key and `make check-contract` runs without secrets as CI
#     expects; tests/unit/integrations/llm/test_service_import.py guards that.
#
# A constraint rather than an entry in [project.dependencies]: openai is a
# transitive dependency, so this bounds it if something pulls it in without
# claiming the project depends on it directly. It is a hold, not a statement
# about what the project supports.
constraint-dependencies = [
    "openai<4",
]

[tool.app.metadata]
# The service's public identity, and the one place a fork changes it.
#
# Deliberately here rather than in server/.env.<env>: these values land verbatim
# in the `info` block of the committed artifact server/openapi.json, api_v1_str
# prefixes every versioned key in its `paths`, and orval stamps the title into
# the header of every generated client file. Read from a gitignored env file
# they would differ per machine, and `make check-contract` would then fail on CI
# and on every fresh clone — so the parameter could never actually be used.
# pyproject.toml is committed, so every machine and CI read the same bytes.
#
# The version lives in [project] above, not here, so there is one of it.
#
# Change any of these, then run `make gen-contract` from the repo root and
# commit the regenerated artifacts in the same commit.
title = "Personal Finance - Server"
description = "API for Personal Finance: transactions, analytics and insights for one user's money."
api_v1_str = "/api/v1"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 119
exclude = ["migrations", "*.ipynb", "venv"]

[tool.ruff.lint]
# Bugbear (`B`), import order (`I`) and docstring (`D`) rules on top of the defaults.
select = ["E", "F", "I", "B", "ERA", "D"]
# Never enforce `E501` (line length violations).
ignore = ["E501", "F401", "D107", "D203", "D213", "B904", "B008"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
# Both must load dotenv before importing `app`.
"alembic/env.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# Test names are the documentation.
"tests/**" = ["D"]

[tool.importlinter]
root_package = "app"
# R4 lets a module type-hint another's model under TYPE_CHECKING.
exclude_type_checking_imports = true
# R9 forbids third-party packages; import-linter only graphs them with this on.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "R2: layers import downward only"
type = "layers"
# ':' joins siblings that may import each other; '|' would forbid it.
layers = [
    "app.main",
    "app.api",
    "app.modules",
    "app.integrations : app.agents",
    "app.core : app.database : app.exceptions : app.models : app.schemas : app.utils",
]

[[tool.importlinter.contracts]]
name = "R6: modules form a DAG — a module imports only those listed below it"
type = "layers"
layers = [
    "app.modules.conversation | app.modules.insights",
    "app.modules.analytics",  # below conversation: step 7's chat tools call it
    "app.modules.transaction",
    "app.modules.account",
]

# R1: one contract per module, listing every OTHER module's submodules.
# allow_indirect_imports: a module's own __init__ re-exporting its submodules
# (the public surface) would otherwise register as an indirect import into
# that submodule for every consumer of the root. Direct bypass is what this
# forbids. tests/unit/test_module_contracts.py checks the list is complete.
# forbidden_modules' as_packages option defaults to true (import-linter), so
# "app.modules.<name>.*" also forbids a slot that has grown into a package,
# e.g. "app.modules.account.router" once router.py becomes router/.

[[tool.importlinter.contracts]]
name = "R1: account reaches other modules only through their package roots"
type = "forbidden"
source_modules = ["app.modules.account"]
forbidden_modules = [
    "app.modules.analytics.*",
    "app.modules.conversation.*",
    "app.modules.insights.*",
    "app.modules.transaction.*",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R1: analytics reaches other modules only through their package roots"
type = "forbidden"
source_modules = ["app.modules.analytics"]
forbidden_modules = [
    "app.modules.account.*",
    "app.modules.conversation.*",
    "app.modules.insights.*",
    "app.modules.transaction.*",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R1: conversation reaches other modules only through their package roots"
type = "forbidden"
source_modules = ["app.modules.conversation"]
forbidden_modules = [
    "app.modules.account.*",
    "app.modules.analytics.*",
    "app.modules.insights.*",
    "app.modules.transaction.*",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R1: transaction reaches other modules only through their package roots"
type = "forbidden"
source_modules = ["app.modules.transaction"]
forbidden_modules = [
    "app.modules.account.*",
    "app.modules.analytics.*",
    "app.modules.conversation.*",
    "app.modules.insights.*",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R1: insights reaches other modules only through their package roots"
type = "forbidden"
source_modules = ["app.modules.insights"]
forbidden_modules = [
    "app.modules.account.*",
    "app.modules.analytics.*",
    "app.modules.conversation.*",
    "app.modules.transaction.*",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R9: a domain slot imports neither the ORM nor the framework"
type = "forbidden"
source_modules = ["app.modules.*.domain", "app.modules.*.*.domain"]
forbidden_modules = ["sqlmodel", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
name = "R10: a module's core never imports its feature sub-package"
type = "forbidden"
source_modules = [
    "app.modules.transaction.dependencies",
    "app.modules.transaction.domain",
    "app.modules.transaction.exceptions",
    "app.modules.transaction.handlers",
    "app.modules.transaction.models",
    "app.modules.transaction.repository",
    "app.modules.transaction.router",
    "app.modules.transaction.schemas",
    "app.modules.transaction.service",
]
forbidden_modules = ["app.modules.transaction.imports"]
