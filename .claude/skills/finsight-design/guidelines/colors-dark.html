<!-- @dsCard group="Colors" viewport="700x190" subtitle="Set data-theme="dark"" name="Dark mode surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-surface)}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.sw i{display:block;height:56px;border-radius:8px;border:1px solid rgba(17,21,43,.1)}.sw b{font:500 12px/16px var(--font-sans)}.sw span{font:500 11px/14px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:10px}</style></head><body><div data-theme="dark" style="display:flex;gap:10px;padding:16px;border-radius:12px;background:var(--bg-page)"><div class="sw"><i style="background:var(--bg-page);border-color:rgba(255,255,255,.12)"></i><b style="color:var(--text-primary)">page</b><span>--bg-page</span></div><div class="sw"><i style="background:var(--bg-sidebar);border-color:rgba(255,255,255,.12)"></i><b style="color:var(--text-primary)">sidebar</b><span>--bg-sidebar</span></div><div class="sw"><i style="background:var(--bg-surface);border-color:rgba(255,255,255,.12)"></i><b style="color:var(--text-primary)">surface</b><span>--bg-surface</span></div><div class="sw"><i style="background:var(--bg-subtle);border-color:rgba(255,255,255,.12)"></i><b style="color:var(--text-primary)">subtle</b><span>--bg-subtle</span></div><div class="sw"><i style="background:var(--border-default);border-color:rgba(255,255,255,.12)"></i><b style="color:var(--text-primary)">border</b><span>--border-default</span></div><div class="sw"><i style="background:var(--brand);border-color:rgba(255,255,255,.12)"></i><b style="color:var(--text-primary)">brand</b><span>--brand</span></div></div></body></html>
