<!-- @dsCard group="Charts" viewport="700x240" subtitle="Top 6 + "Other"; legend carries the detail" name="Donut with many categories" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-surface)}.t{font:var(--text-caption);color:var(--text-muted);margin-bottom:8px}</style></head><body><div style="display:flex;gap:12px"><div  style="background:var(--bg-surface);border:1px solid var(--border-default);border-radius:12px;padding:16px;flex:1;min-width:0"><div class="pie" style="display:flex;gap:16px;align-items:center"></div></div><div data-theme="dark" style="background:var(--bg-surface);border:1px solid var(--border-default);border-radius:12px;padding:16px;flex:1;min-width:0"><div class="pie" style="display:flex;gap:16px;align-items:center"></div></div></div><script>
const data=[['Housing',950],['Groceries',420],['Transport',150],['Dining out',140],['Subscriptions',64],['Health',60],['Gifts',45],['Clothing',40],['Pets',32],['Education',28],['Hobbies',24],['Misc',18]];
const head6=data.slice(0,6),rest=data.slice(6),other=rest.reduce((a,b)=>a+b[1],0);
const items=[...head6.map((d,i)=>[d[0],d[1],'var(--chart-'+(i+1)+')']),['Other · '+rest.length,other,'var(--chart-other)']];
const tot=items.reduce((a,b)=>a+b[1],0);let a0=-Math.PI/2;const R=70,r=46,cx=80,cy=80;
const arcs=items.map(([n,v,c])=>{const a1=a0+v/tot*2*Math.PI,big=a1-a0>Math.PI?1:0,p=(R2,a)=>[cx+R2*Math.cos(a),cy+R2*Math.sin(a)];
const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);a0=a1;
return '<path d="M'+x0+' '+y0+'A'+R+' '+R+' 0 '+big+' 1 '+x1+' '+y1+'L'+x2+' '+y2+'A'+r+' '+r+' 0 '+big+' 0 '+x3+' '+y3+'Z" fill="'+c+'" stroke="var(--chart-gap)" stroke-width="2"/>';}).join('');
const fmt=n=>'$ '+n.toLocaleString('en-US');
document.querySelectorAll('.pie').forEach(el=>{el.innerHTML='<svg width="160" height="160" viewBox="0 0 160 160" style="flex:none">'+arcs+'<text x="80" y="76" text-anchor="middle" style="font:500 11px Onest;fill:var(--text-muted)">Spent</text><text x="80" y="96" text-anchor="middle" style="font:600 18px Onest;fill:var(--text-primary)">'+fmt(tot)+'</text></svg><div style="flex:1;display:flex;flex-direction:column;gap:7px;min-width:0">'+items.map(([n,v,c])=>'<div style="display:flex;align-items:center;gap:8px;font:var(--text-label)"><i style="width:10px;height:10px;border-radius:3px;background:'+c+';flex:none"></i><span style="flex:1;color:var(--text-primary)">'+n+'</span><span style="color:var(--text-muted)">'+Math.round(v/tot*100)+'%</span><span style="width:60px;text-align:right;color:var(--text-primary)">'+fmt(v)+'</span></div>').join('')+'</div>';});
</script></body></html>
