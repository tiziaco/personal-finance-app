<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-surface)}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.sw i{display:block;height:56px;border-radius:8px;border:1px solid rgba(17,21,43,.1)}.sw b{font:500 12px/16px var(--font-sans)}.sw span{font:500 11px/14px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:10px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--ink-900)"></i><b>900</b><span>--ink-900</span></div><div class="sw"><i style="background:var(--ink-600)"></i><b>600</b><span>--ink-600</span></div><div class="sw"><i style="background:var(--ink-400)"></i><b>400</b><span>--ink-400</span></div><div class="sw"><i style="background:var(--ink-300)"></i><b>300</b><span>--ink-300</span></div><div class="sw"><i style="background:var(--ink-200)"></i><b>200</b><span>--ink-200</span></div><div class="sw"><i style="background:var(--ink-100)"></i><b>100</b><span>--ink-100</span></div><div class="sw"><i style="background:var(--ink-50)"></i><b>50</b><span>--ink-50</span></div></div></body></html>
