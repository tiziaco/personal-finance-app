<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-surface)}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.sw i{display:block;height:56px;border-radius:8px;border:1px solid rgba(17,21,43,.1)}.sw b{font:500 12px/16px var(--font-sans)}.sw span{font:500 11px/14px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:10px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--income-500)"></i><b>income</b><span>--income-500</span></div><div class="sw"><i style="background:var(--income-50)"></i><b>income bg</b><span>--income-50</span></div><div class="sw"><i style="background:var(--expense-500)"></i><b>expense</b><span>--expense-500</span></div><div class="sw"><i style="background:var(--expense-50)"></i><b>expense bg</b><span>--expense-50</span></div><div class="sw"><i style="background:var(--warning-500)"></i><b>warning</b><span>--warning-500</span></div><div class="sw"><i style="background:var(--info-500)"></i><b>info</b><span>--info-500</span></div></div></body></html>
